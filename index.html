  <style>
    :root {
      --bg-main: #0f172a;       /* Deep slate for main background */
      --bg-sidebar: #1e293b;    /* Slightly lighter slate for sidebar/cards */
      --border: #334155;        /* Subtle border color */
      --primary: #38bdf8;       /* Sky blue accent */
      --primary-hover: #7dd3fc;
      --text-main: #f8fafc;     /* Crisp white text */
      --text-muted: #94a3b8;    /* Muted text for secondary info */
      --highlight: #f59e0b;     /* Orange for "New" updates */
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      display: flex; /* Establishes the two-column layout */
      min-height: 100vh;
    }

    /* --- Sidebar Navigation --- */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 2rem 1.5rem 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 1.5rem;
      margin: 0;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .sidebar-header p {
      color: var(--primary);
      margin: 0.3rem 0 0 0;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    nav {
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: block;
    }

    nav a:hover {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--primary);
    }

    /* --- Main Content Area --- */
    .main-content {
      flex-grow: 1;
      padding: 3rem 5%;
      min-width: 0; /* Prevents flexbox overflowing */
    }

    .content-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    /* --- Cards / Accordions --- */
    .card {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .card:hover { border-color: var(--primary); }

    summary {
      padding: 1.25rem 1.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    summary::-webkit-details-marker { display: none; }
    summary::after {
      content: "▼";
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    details[open] summary::after { transform: rotate(180deg); color: var(--primary); }
    details[open] summary {
      border-bottom: 1px solid var(--border);
      background-color: rgba(0,0,0,0.15);
    }

    .content { padding: 1.5rem; animation: fadeIn 0.3s ease-in-out; }

    .section-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 1.5rem 0 0.8rem 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .section-title:first-child { margin-top: 0; }

    /* --- Links List --- */
    .link-list { list-style: none; padding: 0; margin: 0; }
    .link-list li { margin-bottom: 0.8rem; display: flex; flex-direction: column; align-items: flex-start; word-break: break-word; }
    .link-row { display: flex; align-items: center; }
    .link-icon { margin-right: 0.6rem; font-size: 1.1rem; opacity: 0.9; }

    .link-list a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .link-list a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* --- Updates Specific Styling --- */
    .updates-card {
      border: 1px solid var(--highlight);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.1);
      background: linear-gradient(to right, rgba(30, 41, 59, 1), rgba(30, 41, 59, 0.8));
    }
    .updates-card summary { color: var(--highlight); }
    .badge-new {
      background-color: var(--highlight); color: #000; font-size: 0.7rem; font-weight: 700;
      padding: 0.15rem 0.5rem; border-radius: 4px; margin-left: 0.8rem; vertical-align: middle;
      letter-spacing: 0.05em;
    }
    .update-date {
      font-size: 0.8rem; color: var(--text-muted); display: block; margin-left: 1.7rem; margin-top: 0.2rem;
    }

    .footer-section { text-align: center; margin-top: 4rem; padding-bottom: 2rem; border-top: 1px solid var(--border); padding-top: 2rem;}

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    /* --- Mobile Responsiveness --- */
    @media (max-width: 900px) {
      body { flex-direction: column; }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative; /* Removes sticky on mobile for better scrolling */
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-header { padding: 1.5rem; text-align: center; }

      nav {
        flex-direction: row;
        overflow-x: auto; /* Horizontal scroll for chapters on mobile */
        padding: 0.5rem 1rem;
        white-space: nowrap;
        gap: 0.5rem;
      }

      nav a { padding: 0.5rem 0.8rem; font-size: 0.85rem; }

      .main-content { padding: 2rem 1rem; }
    }
  </style>

</head>

  /*
   * =====================================================================
   * SITE RENDERER ENGINE
   * =====================================================================
   */
  const navContainer = document.getElementById('nav-container');
  const mainContainer = document.getElementById('main-container');

  const getIcon = (type) => {
    switch(type) {
      case 'ppt': return '🌐';
      case 'pdf': return '📄';
      case 'book': return '📚';
      case 'exam': return '📝';
      default: return '🔗';
    }
  };

  let recentUpdates = [];
  siteData.forEach(chapter => {
    chapter.sections.forEach(section => {
      section.links.forEach(link => {
        if (link.date) {
          recentUpdates.push({ ...link, chapterName: chapter.title.split(':')[0] });
        }
      });
    });
  });

  recentUpdates.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Render Updates
  if (recentUpdates.length > 0) {
    const updatesLink = document.createElement('a');
    updatesLink.href = `#updates`;
    updatesLink.textContent = "🔥 Updates";
    navContainer.appendChild(updatesLink);

    const updatesTag = document.createElement('details');
    updatesTag.className = 'card updates-card';
    updatesTag.id = 'updates';
    updatesTag.open = true;

    const summaryTag = document.createElement('summary');
    summaryTag.textContent = "🔔 Recent Updates";
    updatesTag.appendChild(summaryTag);

    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';
    const ul = document.createElement('ul');
    ul.className = 'link-list';

    recentUpdates.slice(0, 5).forEach(link => {
      const li = document.createElement('li');
      const target = (link.type === 'ppt' || link.url.startsWith('http')) ? '_blank' : '';
      const download = (link.type === 'pdf' || link.type === 'exam' || link.type === 'book') ? 'download' : '';
      const dateFormatted = new Date(link.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      li.innerHTML = `
        <div class="link-row">
          <span class="link-icon">${getIcon(link.type)}</span>
          <a href="${link.url}" ${target ? `target="${target}"` : ''} ${download}>${link.name}</a>
          <span class="badge-new">NEW</span>
        </div>
        <span class="update-date">Added on ${dateFormatted} in ${link.chapterName}</span>
      `;
      ul.appendChild(li);
    });

    contentDiv.appendChild(ul);
    updatesTag.appendChild(contentDiv);
    mainContainer.appendChild(updatesTag);
  }

  // Render Chapters
  siteData.forEach(chapter => {
    const navLink = document.createElement('a');
    navLink.href = `#${chapter.id}`;
    navLink.textContent = chapter.title.includes(':') ? chapter.title.split(':')[0] : chapter.title;
    navContainer.appendChild(navLink);

    const detailsTag = document.createElement('details');
    detailsTag.className = 'card';
    detailsTag.id = chapter.id;

    const summaryTag = document.createElement('summary');
    summaryTag.textContent = chapter.title;
    detailsTag.appendChild(summaryTag);

    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';

    chapter.sections.forEach(section => {
      const heading = document.createElement('h3');
      heading.className = 'section-title';
      heading.textContent = section.heading;
      contentDiv.appendChild(heading);

      const ul = document.createElement('ul');
      ul.className = 'link-list';

      section.links.forEach(link => {
        const li = document.createElement('li');
        const target = (link.type === 'ppt' || link.url.startsWith('http')) ? '_blank' : '';
        const download = (link.type === 'pdf' || link.type === 'exam' || link.type === 'book') ? 'download' : '';
        const badge = link.date ? `<span class="badge-new">NEW</span>` : '';

        li.innerHTML = `
          <div class="link-row">
            <span class="link-icon">${getIcon(link.type)}</span>
            <a href="${link.url}" ${target ? `target="${target}"` : ''} ${download}>${link.name}</a>
            ${badge}
          </div>
        `;
        ul.appendChild(li);
      });
      contentDiv.appendChild(ul);
    });
    detailsTag.appendChild(contentDiv);
    mainContainer.appendChild(detailsTag);
  });
